services:
  - type: web
    name: trustnotice-api
    runtime: docker
    rootDir: backend
    healthCheckPath: /docs
    disk: { name: storage, mountPath: /data/storage, sizeGB: 1 }
    envVars:
      - { key: DATABASE_URL, fromDatabase: { name: trustnotice-db, property: connectionString } }
      - { key: JWT_SECRET, generateValue: true }
      - { key: STORAGE_PATH, value: /data/storage }
      - { key: ED25519_PRIVATE_KEY, sync: false }
      - { key: ED25519_PUBLIC_KEY, sync: false }
      - { key: FRONTEND_URL, sync: false }
      - { key: BACKEND_URL, sync: false }
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
databases:
  - { name: trustnotice-db, plan: free }
