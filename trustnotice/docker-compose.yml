services:
  db:
    image: postgres:16
    env_file: ./backend/.env
    environment: { POSTGRES_USER: trust, POSTGRES_DB: trustnotice }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U trust"], interval: 5s, retries: 10 }
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      STORAGE_PATH: /data/storage
    volumes: [storage:/data/storage]   # outside any public web directory
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [backend]
volumes: { pgdata: {}, storage: {} }
